name: ECC OrBIt CI
on:
  push:
    branches: [ "feat/ecc-orbit-cloudflare-v1" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecc-orbit-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Validate ordered D1 migrations and append-only invariants
        run: python3 scripts/validate_migrations.py
