name: OpenAI ChatGPT connectivity check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openai-connectivity:
    runs-on: ubuntu-latest
    steps:
      - name: Verify OpenAI API connectivity
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY}" ]]; then
            echo "::error::OPENAI_API_KEY is not configured"
            exit 1
          fi
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            https://api.openai.com/v1/models \
            -H "Authorization: Bearer ${OPENAI_API_KEY}")"
          if [[ "$http_code" != "200" ]]; then
            echo "::error::OpenAI API returned HTTP ${http_code}"
            sed -E 's/(sk-[A-Za-z0-9_-]+|Bearer [^[:space:]"}]+)/[REDACTED]/g' "$response_file"
            exit 1
          fi
          echo "PASS: OpenAI API key authenticated successfully"
