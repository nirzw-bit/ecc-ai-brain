name: ECC GBPUSD historical acquisition

on:
  workflow_dispatch:
  schedule:
    - cron: "20 17 * * *"
  push:
    branches:
      - feat/ecc-orbit-cloudflare-v1
    paths:
      - ".github/workflows/forex-gbpusd-history.yml"
      - "scripts/forex/**"

permissions:
  contents: read

concurrency:
  group: ecc-gbpusd-history
  cancel-in-progress: false

jobs:
  acquire-validate:
    name: Download and validate GBPUSD H1/H4
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated development branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/ecc-orbit-cloudflare-v1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Record acquisition start
        run: |
          mkdir -p data reports
          date -u +"%Y-%m-%dT%H:%M:%SZ" > reports/runner-started-at-utc.txt
      - name: Attempt Dukascopy H1/H4 bid and ask
        id: dukascopy
        shell: bash
        run: |
          set -euo pipefail
          download_all() {
            npx --yes dukascopy-node@1.51.1 -i gbpusd -from 2003-05-04 -to now -t h1 -p bid -f csv -dir data -fn gbpusd-h1-bid --batch-size 3 --batch-pause 1500 --retries 3 --rate-limit-retries 3 --cache || return 1
            npx --yes dukascopy-node@1.51.1 -i gbpusd -from 2003-05-04 -to now -t h1 -p ask -f csv -dir data -fn gbpusd-h1-ask --batch-size 3 --batch-pause 1500 --retries 3 --rate-limit-retries 3 --cache || return 1
            npx --yes dukascopy-node@1.51.1 -i gbpusd -from 2003-05-04 -to now -t h4 -p bid -f csv -dir data -fn gbpusd-h4-bid --batch-size 3 --batch-pause 1500 --retries 3 --rate-limit-retries 3 --cache || return 1
            npx --yes dukascopy-node@1.51.1 -i gbpusd -from 2003-05-04 -to now -t h4 -p ask -f csv -dir data -fn gbpusd-h4-ask --batch-size 3 --batch-pause 1500 --retries 3 --rate-limit-retries 3 --cache || return 1
          }
          if download_all; then
            echo "provider=dukascopy" >> "$GITHUB_OUTPUT"
          else
            echo "Dukascopy denied hosted-runner request or download failed; selecting documented free fallback."
            rm -f data/gbpusd-h1-*.csv data/gbpusd-h4-*.csv
            echo "provider=histdata" >> "$GITHUB_OUTPUT"
          fi
      - name: HistData M1 fallback and UTC H1/H4 aggregation
        if: steps.dukascopy.outputs.provider == 'histdata'
        run: |
          python -m pip install --disable-pip-version-check histdata-fetcher==0.1.0
          python scripts/forex/fetch_histdata_fallback.py
      - name: Validate OHLC, duplicates, gaps and Wilder ATR(14)
        run: python scripts/forex/validate_gbpusd.py
      - name: Preserve provenance metadata
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > reports/runner-finished-at-utc.txt
          test -f reports/source-metadata.json || cat > reports/source-metadata.json <<'JSON'
          {"provider":"Dukascopy public historical feed","client":"dukascopy-node 1.51.1","requested_start":"2003-05-04","requested_end":"now","timezone":"UTC","price_types":["bid","ask"],"timeframes":["H1","H4"],"broker_connection":false,"trade_execution":false}
          JSON
      - name: Upload raw datasets and research report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecc-gbpusd-history-${{ github.run_id }}
          path: |
            data/
            reports/
          if-no-files-found: warn
          retention-days: 30
